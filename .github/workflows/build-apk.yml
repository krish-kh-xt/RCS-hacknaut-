# Builds the RCS Android app (debug APK) for free on GitHub's servers.
# Run it from: repo > Actions > "Build Android APK" > Run workflow.
# Before the first run, add a repository VARIABLE (not secret) named VITE_API_URL
# (Settings > Secrets and variables > Actions > Variables), e.g. https://your-backend.onrender.com
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SYNC_INTERVAL_MS: ${{ vars.VITE_SYNC_INTERVAL_MS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the backend URL is set
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Missing repository variable VITE_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Capacitor 8 needs Node 22 or newer
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Build the web app (the backend URL is baked in here)
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: RCS-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
